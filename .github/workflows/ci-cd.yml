name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: gcr.io
  IMAGE_NAME: cors-preflight-service

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linting
      run: npm run lint
    
    - name: Run tests
      run: npm test
    
    - name: Build application
      run: npm run build

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment: production
    
    steps:
    - uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ vars.GCP_PROJECT_ID }}

    - name: Configure Docker for GCR
      run: gcloud auth configure-docker --quiet

    - name: Set PROJECT_ID env
      run: |
        if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
          echo "PROJECT_ID=movie-dubie" >> $GITHUB_ENV
        else
          echo "PROJECT_ID=${{ vars.GCP_PROJECT_ID }}" >> $GITHUB_ENV
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Prepare service account JSON
      id: sa
      shell: bash
      run: |
        KEY='${{ secrets.GCP_SA_KEY }}'
        if [ -z "$KEY" ]; then
          echo "GCP_SA_KEY secret is empty or not available in this context (e.g., PR from fork)." >&2
          exit 1
        fi
        if echo "$KEY" | grep -q '"client_email"'; then
          JSON="$KEY"
        else
          if JSON=$(echo "$KEY" | base64 -d 2>/dev/null); then
            :
          else
            echo "GCP_SA_KEY is neither raw JSON nor base64-encoded JSON." >&2
            exit 1
          fi
        fi
        echo "json<<EOF" >> "$GITHUB_OUTPUT"
        echo "$JSON" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ steps.sa.outputs.json }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ vars.GCP_PROJECT_ID }}
    
    - name: Set PROJECT_ID env
      run: |
        if [ -z "${{ vars.GCP_PROJECT_ID }}" ]; then
          echo "PROJECT_ID=movie-dubie" >> $GITHUB_ENV
        else
          echo "PROJECT_ID=${{ vars.GCP_PROJECT_ID }}" >> $GITHUB_ENV
        fi
    
    - name: Deploy to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: ${{ env.IMAGE_NAME }}
        image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        region: asia-southeast1
        flags: '--allow-unauthenticated --port 8080 --memory 2Gi --cpu 2 --max-instances 10 --min-instances 0'
        revision_traffic: 'LATEST=100'
        env_vars: |
          NODE_ENV=production
          GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}
          STORAGE_BUCKET=movie-dubie-studio-${{ vars.ENVIRONMENT || 'dev' }}
          TRANSCODER_LOCATION=asia-southeast1 